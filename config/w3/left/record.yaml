output_dir: data/left/SESSION_ID
session_name: SESSION_ID
robot_topic_root: /factr2/left
sync:
  queue_size: 20
  slop_seconds: 0.03
recording:
  target_hz: 50.0
  min_hz: 45.0
  sample_timeout_seconds: 0.2
  warn_after_seconds: 2.0
topics:
  joint_pos:
    topic: '{robot_topic_root}/joint_pos'
    field: position
    type: sensor_msgs/JointState
  joint_vel:
    topic: '{robot_topic_root}/joint_vel'
    field: velocity
    type: sensor_msgs/JointState
  joint_cmd:
    topic: '{robot_topic_root}/joint_cmd'
    field: position
    type: sensor_msgs/JointState
  measured_joint_torque:
    topic: '{robot_topic_root}/joint_effort'
    field: effort
    type: sensor_msgs/JointState
contract_version: w3_next_v1
side: left
joint_names:
- left_joint_0
- left_joint_1
- left_joint_2
- left_joint_3
- left_joint_4
- left_joint_5
- left_joint_6
metadata:
  source: real
  tool: SET_TOOL_ID
  gripper: excluded_from_model
  load: SET_LOAD_ID
  calibration:
    path: SET_CALIBRATION_FILE
  control:
    gains: SET_GAINS
    feedforward: SET_FEEDFORWARD
  trajectory_id: SET_TRAJECTORY_ID
  contact:
    present: false
    label: verified_free_motion
  temperature:
    source: SET_TEMPERATURE_SOURCE
  audit_paths:
  - SET_ROSBAG_PATH
  health_gate_enabled: true
