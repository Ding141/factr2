output_dir: data/left/SESSION_ID
session_name: SESSION_ID
robot_topic_root: /factr2/left
sync:
  queue_size: 20
  slop_seconds: 0.03
recording:
  target_hz: 50.0
  min_hz: 45.0
  sample_timeout_seconds: 0.2
  warn_after_seconds: 2.0
topics:
  joint_pos:
    topic: '{robot_topic_root}/joint_pos'
    field: position
    type: sensor_msgs/JointState
  joint_vel:
    topic: '{robot_topic_root}/joint_vel'
    field: velocity
    type: sensor_msgs/JointState
  joint_cmd:
    topic: '{robot_topic_root}/joint_cmd'
    field: position
    type: sensor_msgs/JointState
  measured_joint_torque:
    topic: '{robot_topic_root}/joint_effort'
    field: effort
    type: sensor_msgs/JointState
contract_version: w3_next_v1
side: left
joint_names:
- left_joint_0
- left_joint_1
- left_joint_2
- left_joint_3
- left_joint_4
- left_joint_5
- left_joint_6
