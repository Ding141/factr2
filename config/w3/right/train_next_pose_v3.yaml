# Paper NEXT model/loss; additionally audit measured fast motion, not configured speed.
data:
  arm_mode: single
  keys:
    joint_pos: joint_pos
    joint_vel: joint_vel
    joint_cmd: joint_cmd
    measured_joint_torque: measured_joint_torque
  history: 50
  manifest: data/right/SET_DATASET_ID/split.json
  memory_budget_mb: 512
  sample_hz: 100
  require_independent_sessions: true
  coverage_requirements:
    minimum_static_fraction: 0.1
    minimum_multi_joint_fraction: 0.25
    maximum_single_joint_fraction: 0.6
    max_validation_pose_distance_deg: 5.0
    minimum_fast_fraction: 0.15
    minimum_fast_speed_p95_deg_s: 14.0
    minimum_fast_direction_samples: 100
model:
  type: lstm
  state_mode: stateless
  hidden_size: 128
  num_layers: 2
  bidirectional: false
  head_hidden: 256
  head_layers: 2
  dropout: 0.1
train:
  batch_size: 2048
  epochs: 120
  learning_rate: 0.001
  device: cpu
  seed: 0
  cpu_threads: 8
  optimizer: adamw
  weight_decay: 1.0e-06
  gradient_clip: 1.0
  loss_units: physical_nm
  early_stopping:
    enabled: true
    patience: 20
    warmup: 10
    min_delta: 1.0e-05
  validation_diagnostics: true
save:
  output_dir: runs
  run_name: next_right_direct_pose_v3_DATASET_ID
contract_version: w3_next_v1
side: right
joint_names:
- right_joint_0
- right_joint_1
- right_joint_2
- right_joint_3
- right_joint_4
- right_joint_5
- right_joint_6
