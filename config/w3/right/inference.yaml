checkpoint_dir: runs/next_right_DATASET_ID_TIMESTAMP
robot_topic_root: /factr2/right
next_topic_root: /next/right
device: cpu
sync:
  queue_size: 20
  slop_seconds: 0.03
topics:
  joint_pos:
    topic: '{robot_topic_root}/joint_pos'
    field: position
    type: sensor_msgs/JointState
  joint_vel:
    topic: '{robot_topic_root}/joint_vel'
    field: velocity
    type: sensor_msgs/JointState
  joint_cmd:
    topic: '{robot_topic_root}/joint_cmd'
    field: position
    type: sensor_msgs/JointState
  measured_joint_torque:
    topic: '{robot_topic_root}/joint_effort'
    field: effort
    type: sensor_msgs/JointState
outputs:
  external_joint_torque: '{next_topic_root}/external_joint_torque'
  external_joint_torque_raw: '{next_topic_root}/external_joint_torque/raw'
  free_joint_torque_pred: '{next_topic_root}/free_joint_torque_pred'
  mse: '{next_topic_root}/mse'
  normalized_contact_magnitude: '{next_topic_root}/normalized_contact_magnitude'
  contact_state: '{next_topic_root}/contact_state'
smoothing:
  enabled: true
  mode: ema
  ema_alpha: 0.2
  cutoff_hz: 5.0
  sample_hz: 50.0
normalized_contact_magnitude:
  source: filtered_external_joint_torque
  norm: l1
  scale: 1.0
contact:
  enabled: true
  low_threshold: 1.0
  high_threshold: 2.0
contract_version: w3_next_v1
side: right
joint_names:
- right_joint_0
- right_joint_1
- right_joint_2
- right_joint_3
- right_joint_4
- right_joint_5
- right_joint_6
