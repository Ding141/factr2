# Synthetic development smoke only; baseline architecture unchanged.
data:
  arm_mode: single
  keys:
    joint_pos: joint_pos
    joint_vel: joint_vel
    joint_cmd: joint_cmd
    measured_joint_torque: measured_joint_torque
  history: 50
  manifest: data/mock/right/split.json
  memory_budget_mb: 512
model:
  type: lstm
  state_mode: stateless
  hidden_size: 128
  num_layers: 2
  bidirectional: false
  head_hidden: 256
  head_layers: 2
  dropout: 0.1
train:
  batch_size: 64
  epochs: 2
  learning_rate: 0.001
  device: cpu
  seed: 0
  cpu_threads: 1
save:
  output_dir: runs
  run_name: next_right_synthetic_smoke
contract_version: w3_next_v1
side: right
joint_names:
- right_joint_0
- right_joint_1
- right_joint_2
- right_joint_3
- right_joint_4
- right_joint_5
- right_joint_6
